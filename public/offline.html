<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0812">
  <title>Shubhu – Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #f5f3ff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 30% 20%, #3b2566 0%, #0b0812 60%);
    }
    img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 12px 40px rgba(139, 92, 246, .35); }
    h1 { margin: 20px 0 8px; font-size: 22px; }
    p { margin: 0 auto 24px; max-width: 320px; color: #c4b5fd; line-height: 1.5; font-size: 14px; }
    button {
      border: 0; border-radius: 999px; padding: 12px 28px; font-size: 14px; font-weight: 600;
      background: #c4b5fd; color: #1a1030; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="84" height="84">
    <h1>You're offline</h1>
    <p>Shubhu needs an internet connection to stream music. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
